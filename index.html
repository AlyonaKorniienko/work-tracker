<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер робочого часу</title>
<style>html,body{margin:0;background:#FFF6EA}</style>
</head>
<body>
<div id="app">
  <div class="boot">Готую твій трекер…</div>
</div>

<style>
  #app {
    --ground: #FFF6EA;
    --surface: #FFFCF7;
    --ink: #4B3A5A;
    --muted: #9C8FAE;
    --line: #F0E3E9;
    --plum: #7E5AA8;
    --pink: #E890B8;
    --lav: #B49AE4;
    --gold: #E8B84B;
    --soft: #F6ECFB;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Nunito, Inter, Roboto, sans-serif;
    color: var(--ink);
    background: var(--ground);
    padding: 14px;
    border-radius: 22px;
    max-width: 780px;
    margin: 0 auto;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  #app * { box-sizing: border-box; }
  #app button { font: inherit; cursor: pointer; }
  #app button:focus-visible,
  #app input:focus-visible,
  #app select:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }

  #app .boot { padding: 40px 0; text-align: center; color: var(--muted); }

  #app .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #app .topbar img.ava { width: 38px; height: 38px; border-radius: 50%; flex: none; box-shadow: 0 2px 8px rgba(126,90,168,.18); }
  #app .topbar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .01em; flex: 1; }
  #app .topbar .today { font-size: 13px; color: var(--muted); text-align: right; }
  #app .topbar .today b { color: var(--plum); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* запуск із головного екрана: на весь екран, з відступом під «чубчик» і смугу жестів */
  html[data-standalone] body { margin: 0; background: #FFF6EA; }
  html[data-standalone] #app {
    border-radius: 0; max-width: none; min-height: 100vh;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-right, 0px) + 12px)
             calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 12px);
  }
  #app .card.wk { background: linear-gradient(170deg, #FFF9F0, #FFFCF7 55%); }
  #app .wktop { display: flex; align-items: baseline; gap: 9px; margin: 2px 0 9px; }
  #app .wkbig { font-size: 32px; font-weight: 300; letter-spacing: -.02em; color: var(--plum); font-variant-numeric: tabular-nums; }
  #app .wkof { font-size: 13px; color: var(--muted); }
  #app .wkmetrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  #app .wkmetrics > div { text-align: left; }
  #app .wkmetrics b { display: block; font-size: 15px; font-weight: 700; color: var(--plum); font-variant-numeric: tabular-nums; line-height: 1.3; }
  #app .wkmetrics span { font-size: 11.5px; color: var(--muted); line-height: 1.3; display: block; }
  #app .wkdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 16px; }
  #app .wd { text-align: center; }
  #app .wd .wdbar { height: 62px; display: flex; align-items: flex-end; justify-content: center; }
  #app .wd .wdbar i { display: block; width: 100%; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, #9B7FD4, #E890B8); }
  #app .wd.we .wdbar i { background: #D8CCE4; }
  #app .wd .wdv { font-size: 10.5px; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 4px; min-height: 14px; }
  #app .wd .wdn { font-size: 10.5px; color: var(--muted); }
  #app .wd.now .wdn { color: var(--plum); font-weight: 700; }
  #app .wd.now .wdv { font-weight: 700; color: var(--plum); }
  #app .verdict { margin-top: 14px; font-size: 12.5px; line-height: 1.5; padding: 9px 11px; border-radius: 11px; }
  #app .verdict.good { background: #ECF6F1; color: #3E7A66; }
  #app .verdict.warn { background: #FBEEF3; color: #9B4568; }

  #app .lvlrow { display: flex; gap: 4px; flex-wrap: wrap; }
  #app .lvl { flex: 1 1 0; min-width: 30px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 9px; padding: 8px 0; font-size: 13px; font-weight: 600; }
  #app .lvl.sm { flex: none; width: 30px; padding: 5px 0; font-size: 12px; border-radius: 8px; }
  #app .sphrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #app .sphrow:last-of-type { border-bottom: 0; }
  #app .sphname { display: flex; align-items: center; gap: 7px; font-size: 13px; flex: 1 1 150px; min-width: 0; }
  #app .sphname .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #app .sphbtns { display: flex; align-items: center; gap: 3px; flex: none; }
  #app .chip.ghost.on { border-style: solid; border-color: var(--lav); background: var(--soft); color: var(--plum); font-weight: 600; }

  #app .syncbar { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); margin: -6px 0 10px 4px; }
  #app .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  #app .synbtn { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 2px 6px; border-radius: 8px; line-height: 1; }
  #app .synbtn:hover { color: var(--plum); }

  #app .tabs { display: flex; gap: 4px; margin-bottom: 12px; background: #F6E9EE; padding: 4px; border-radius: 14px; }
  #app .tabs button {
    flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 11px;
    font-size: 12.5px; color: var(--muted); font-weight: 600; padding-left: 2px; padding-right: 2px;
  }
  #app .tabs button[aria-selected="true"] { background: var(--surface); color: var(--plum); box-shadow: 0 1px 4px rgba(126,90,168,.14); }

  #app .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 10px rgba(190,150,190,.07); }
  #app .card h2 { font-size: 13px; font-weight: 700; margin: 0 0 12px; color: var(--muted); }

  #app .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

  #app .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #app .chip {
    border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  }
  #app .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #app .chip[aria-pressed="true"] { background: var(--soft); border-color: var(--lav); color: var(--plum); font-weight: 700; }
  #app .chip[disabled] { opacity: .5; cursor: default; }
  #app .chip.ghost { border-style: dashed; color: var(--muted); background: transparent; }
  /* задача, на якій зараз іде відлік */
  #app .chip.live { box-shadow: inset 0 0 0 1.5px var(--go, #4FA88B); }
  #app .chip.live::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #4FA88B; margin-left: 2px; }

  #app .timerbox { display: flex; align-items: center; gap: 12px; margin: 8px 0 2px; }
  #app .readout {
    font-size: 52px; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    line-height: 1.05; color: var(--plum);
  }
  #app .readout.idle { color: #CFC3DA; }
  #app .uni { width: 62px; height: 62px; border-radius: 50%; flex: none; box-shadow: 0 3px 12px rgba(126,90,168,.2); }
  @media (prefers-reduced-motion: no-preference) {
    #app .uni.float { animation: fl 3.4s ease-in-out infinite; }
    @keyframes fl { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  }
  #app .nowline { font-size: 13px; color: var(--muted); min-height: 19px; margin-bottom: 14px; }

  #app .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #app .btn { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 14px; padding: 11px 16px; font-size: 14px; font-weight: 600; }
  #app .btn.primary { background: var(--plum); border-color: var(--plum); color: #fff; flex: 1 1 160px; }
  #app .btn.danger { color: #B4557E; border-color: #F3DCE5; }
  #app .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 11px; }
  #app .btn:disabled { opacity: .45; cursor: default; }

  #app .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  #app .goal .gtop { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; gap: 8px; }
  #app .goal .gtop b { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--plum); }
  #app .goal .gtop span { color: var(--muted); font-size: 12px; }
  #app .bar { height: 8px; background: #F4EAF0; border-radius: 4px; overflow: hidden; }
  #app .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--pink), var(--lav)); }
  #app .bar i.over { background: linear-gradient(90deg, var(--gold), var(--pink)); }

  #app .seg { display: flex; gap: 4px; background: #F6E9EE; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
  #app .seg button { flex: 1; border: 0; background: transparent; padding: 6px; border-radius: 9px; font-size: 12px; color: var(--muted); font-weight: 600; }
  #app .seg button[aria-selected="true"] { background: var(--surface); color: var(--plum); }

  #app .dialwrap { display: flex; justify-content: center; padding: 4px 0 2px; }
  #app .catrow { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; font-size: 13px; }
  #app .catrow .nm { width: 34%; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #app .catrow .track { flex: 1; height: 10px; background: #F4EAF0; border-radius: 5px; overflow: hidden; }
  #app .catrow .track i { display: block; height: 100%; border-radius: 5px; }
  #app .catrow .val { width: 76px; text-align: right; flex: none; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

  #app .empty { color: var(--muted); font-size: 13px; padding: 10px 0 14px; text-align: center; }
  #app .empty img { width: 190px; max-width: 70%; display: block; margin: 0 auto 8px; opacity: .95; }

  #app .daygroup { margin-bottom: 16px; }
  #app .daygroup .dhead { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  #app .row { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 13px; }
  #app .row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #app .row .txt { flex: 1; min-width: 0; }
  #app .row .txt .t1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #app .row .txt .t2 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #app .row .dur { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--plum); }
  #app .x { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; font-size: 15px; line-height: 1; border-radius: 6px; }
  #app .x:hover { color: #B4557E; }

  #app .field { margin-bottom: 10px; }
  #app .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #app input[type="text"], #app input[type="date"], #app input[type="time"], #app input[type="number"], #app select {
    width: 100%; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px;
    background: #fff; font: inherit; font-size: 14px; color: var(--ink);
  }
  #app .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #app .inline { display: flex; gap: 8px; }
  #app .inline input { flex: 1; }

  #app .catblock { padding: 12px 0; border-bottom: 1px solid var(--line); }
  #app .catblock:last-of-type { border-bottom: 0; }
  #app .catblock .chead { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: 14px; font-weight: 700; }

  #app .modal { position: fixed; inset: 0; background: rgba(75,58,90,.4); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
  #app .modal .box { background: var(--surface); border-radius: 20px; padding: 16px; max-width: 520px; width: 100%; max-height: 80vh; overflow: auto; }
  #app .modal textarea { width: 100%; height: 190px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px; background: #fff; color: var(--ink); }

  #app .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--plum); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; z-index: 60; box-shadow: 0 4px 14px rgba(126,90,168,.3); }

  #app .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

  @media (max-width: 460px) {
    #app .readout { font-size: 44px; }
    #app .uni { width: 54px; height: 54px; }
    #app .goals { grid-template-columns: 1fr; }
    #app .catrow .nm { width: 30%; }
  }
</style>

  const hasLocal = !!(window.storage && typeof window.storage.get === 'function') || lsOk;
  let sync = { st: 'idle', at: null, readAt: 0, dirty: false, timer: null, err: '' };

  async function apiOnce(payload) {
    const res = await fetch(SYNC.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token: SYNC.token }, payload))
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch (e) { throw new Error('Google повернув сторінку замість даних'); }
    if (!data || !data.ok) throw new Error(data && data.error ? data.error : 'таблиця відповіла помилкою');
    return data;
  }

  async function api(payload, ms) {
    let last;
    for (let i = 0; i < 3; i++) {
      try {
        const bell = new Promise((_, rej) =>
          setTimeout(() => rej(new Error('таблиця не відповіла вчасно')), ms || 20000));
        return await Promise.race([apiOnce(payload), bell]);
      } catch (e) {
        last = e;
        if (i < 2) await new Promise(r => setTimeout(r, 1200 * (i + 1)));
      }
    }
    throw last;
  }

  function setSync(st, err) {
    sync.st = st;

      block: ['Не читається таблиця — запис призупинено, щоб не стерти дані', '#C4708F']

  function mergeRemote(d) {
    const dead = {};
    (state.deleted || []).concat((d.config && d.config.deleted) || []).forEach(id => { dead[id] = 1; });
    const seen = {}, merged = [];
    state.sessions.concat(Array.isArray(d.sessions) ? d.sessions : []).forEach(s => {
      if (!s || !s.id || !s.segments || !s.segments.length) return;
      if (dead[s.id] || seen[s.id]) return;
      seen[s.id] = 1;
      merged.push(s);
    });
    state.sessions = merged.sort((a, b) => a.segments[0].s - b.segments[0].s);
    state.deleted = Object.keys(dead).slice(-500);

    const byDate = {};
    (state.checkins || []).concat(Array.isArray(d.checkins) ? d.checkins : []).forEach(k => {
      if (!k || !k.date) return;
      const old = byDate[k.date];
      if (!old || (k.at || 0) >= (old.at || 0)) byDate[k.date] = k;
    });
    state.checkins = Object.keys(byDate).sort().map(x => byDate[x]);

    const c = d.config || {};
    if (Array.isArray(c.spheres) && c.spheres.length) state.spheres = c.spheres;
    if (Array.isArray(c.categories) && c.categories.length) state.categories = c.categories;
    if (c.goals) state.goals = c.goals;
    if (c.pick) state.pick = c.pick;
    /* таймер уже йде на іншому пристрої — не підміняємо свій, але попереджаємо */
    if (state.running && c.running && c.running.currentStart &&
        c.running.currentStart !== state.running.currentStart) {
      otherRunning = c.running;
    } else {
      otherRunning = null;
      if (!state.running && c.running) state.running = c.running;
    }
  }

  async function cloudLoad() {

  const STALE = 60000;

  async function cloudSave() {

        }
      });
      sync.dirty = false;
      sync.at = Date.now();
      setSync('ok');
      return true;
    } catch (e) {

      setSync('err', e);
      return false;
    }
  }

  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');

  function hms(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(t % 60);
  }
  function hrs(ms) {
    const neg = ms < 0;
    const m = Math.round(Math.abs(ms) / 60000);
    const h = Math.floor(m / 60), mm = m % 60;
    let s;
    if (!m) s = '0 хв';
    else if (!h) s = mm + ' хв';
    else if (!mm) s = h + ' год';
    else s = h + ' год ' + mm + ' хв';
    return (neg ? '−' : '') + s;
  }
  function hrsShort(ms) {
    const neg = ms < 0;
    const m = Math.round(Math.abs(ms) / 60000);
    const h = Math.floor(m / 60), mm = m % 60;
    if (!m) return '0';
    return (neg ? '−' : '') + (h ? h + ':' + pad(mm) : mm + ' хв');
  }
  function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function startOfDay(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function startOfWeek(ms) { const d = new Date(startOfDay(ms)); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return d.getTime(); }
  /* зсув на n діб календарно: арифметика в мілісекундах збивається на переході часу */
  function addDays(ms, n) { const d = new Date(ms); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function endOfDay(ms) { return addDays(ms, 1) - 1; }
  const DAYS = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const MONTHS = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
  function humanDate(ms) {
    const d = new Date(ms), t = startOfDay(Date.now());
    if (startOfDay(ms) === t) return 'Сьогодні';
    if (startOfDay(ms) === addDays(t, -1)) return 'Вчора';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + DAYS[d.getDay()];
  }
  function clock(ms) { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  const cat = (id) => state.categories.find(c => c.id === id) || null;
  function task(catId, taskId) { const c = cat(catId); return c ? (c.tasks.find(t => t.id === taskId) || null) : null; }

  function eachHourChunk(s, e, cb) {
    let cur = s, guard = 0;
    while (cur < e && guard++ < 5000) {
      const d = new Date(cur);
      const next = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1, 0, 0, 0).getTime();
      const end = Math.min(next, e);
      cb(cur, end - cur, d);
      cur = end;
    }
  }

  const sessStart = (s) => s.segments[0].s;
  const sessEnd = (s) => s.segments[s.segments.length - 1].e;

  function elapsed() {
    const r = state.running;
    if (!r) return 0;
    let t = r.segments.reduce((a, g) => a + (g.e - g.s), 0);
    if (r.currentStart) t += Date.now() - r.currentStart;
    return t;
  }

  function sumBetween(from, to) {
    let total = 0;
    state.sessions.forEach(s => s.segments.forEach(g => {
      total += Math.max(0, Math.min(g.e, to) - Math.max(g.s, from));
    }));
    const r = state.running;
    if (r) {
      const live = r.segments.concat(r.currentStart ? [{ s: r.currentStart, e: Date.now() }] : []);
      live.forEach(g => { total += Math.max(0, Math.min(g.e, to) - Math.max(g.s, from)); });
    }
    return total;
  }

  function stats(sessions) {
    const byHour = new Array(24).fill(0), byCat = {}, byDay = {};
    sessions.forEach(s => {
      s.segments.forEach(g => eachHourChunk(g.s, g.e, (st, ms, d) => {
        byHour[d.getHours()] += ms;
        byDay[dayKey(st)] = (byDay[dayKey(st)] || 0) + ms;
      }));
      byCat[s.catId] = (byCat[s.catId] || 0) + s.duration;
    });
    return { byHour, byCat, byDay, total: sessions.reduce((a, s) => a + s.duration, 0) };
  }

  /* period: число днів, 0 = весь час, 'tw' = цей тиждень, 'lw' = минулий, 'custom' = свій інтервал */
  function periodRange() {
    const now = Date.now(), today = startOfDay(now);
    if (period === 'tw') return { from: startOfWeek(now), to: endOfDay(today), label: 'цей тиждень' };
    if (period === 'lw') { const a = startOfWeek(addDays(now, -7)); return { from: a, to: endOfDay(addDays(a, 6)), label: 'минулий тиждень' }; }
    if (period === 'custom') {
      const a = custom.from ? dsToMs(custom.from) : today, b = custom.to ? dsToMs(custom.to) : today;
      const lo = Math.min(a, b), hi = Math.max(a, b);
      return { from: lo, to: endOfDay(hi), label: 'свій інтервал' };
    }
    if (period === 0) {
      const all = state.sessions.map(sessStart);
      return { from: all.length ? startOfDay(Math.min.apply(null, all)) : today, to: endOfDay(today), label: 'весь час' };
    }
    return { from: addDays(today, -(period - 1)), to: endOfDay(today), label: period + ' днів' };
  }

  function inPeriod() {
    const r = periodRange();
    return state.sessions.filter(s => sessEnd(s) >= r.from && sessStart(s) <= r.to);
  }

  /* скільки робочих днів (пн–пт) у відрізку */
  function workdaysBetween(from, to) {
    let c = 0, cur = startOfDay(from), guard = 0;
    while (cur <= to && guard++ < 800) {
      const w = new Date(cur).getDay();
      if (w >= 1 && w <= 5) c++;
      const d = new Date(cur);
      cur = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    }
    return c;
  }

  /* зведення по тижню, що містить ms */
  function weekSummary(ms) {
    const wStart = startOfWeek(ms), today = startOfDay(Date.now());
    const goal = (state.goals.weekly || 40) * 3600000;
    const perDay = (state.goals.daily || 8) * 3600000;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(wStart, i);
      days.push({
        ms: d, we: i >= 5, today: d === today, future: d > today,
        v: sumBetween(d, endOfDay(d))
      });
    }
    const total = days.reduce((a, d) => a + d.v, 0);
    const past = days.filter(d => !d.we && !d.future && !d.today).length; // робочі дні, що ПОВНІСТЮ минули
    const left = days.filter(d => !d.we && (d.future || d.today)).length; // робочі дні попереду, з сьогоднішнім
    const expected = past * perDay;                                       // скільки мало б бути на ранок сьогодні
    const remain = Math.max(0, goal - total);
    return {
      wStart, days, total, goal, perDay, left, remain,
      ahead: total - expected,
      need: left > 0 ? remain / left : 0,
      done: total >= goal
    };
  }

  /* баланс факт−норма по тижнях */
  function weeklyBalance(n) {
    const today = startOfDay(Date.now()), perDay = (state.goals.daily || 8) * 3600000;
    const cw = startOfWeek(Date.now());
    if (!state.sessions.length) return [];
    const firstWeek = startOfWeek(Math.min.apply(null, state.sessions.map(sessStart)));
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const ws = addDays(cw, -7 * i);
      if (ws < firstWeek) continue;                 // до першого запису норми ще не було
      const we = endOfDay(addDays(ws, 6));
      const v = sumBetween(ws, Math.min(we, endOfDay(today)));
      /* норма — лише за повністю завершені дні, щоб поточний тиждень не виглядав боргом */
      const normTo = Math.min(we, addDays(today, -1));
      const norm = normTo < ws ? 0 : workdaysBetween(ws, normTo) * perDay;
      if (!v && !norm) continue;
      out.push({ ws, v, norm, bal: v - norm, cur: ws === cw });
    }
    return out;
  }

  function viewTimer() {
    const r = state.running;
    const running = !!(r && r.currentStart);
    const c = cat(state.pick.catId) || state.categories[0];
    const activeCat = r ? cat(r.catId) : c;
    const activeTask = r ? task(r.catId, r.taskId) : task(state.pick.catId, state.pick.taskId);

    /* вибір лишається доступним і під час відліку: інакше задачу не перемкнути */
    const pickedCat = state.pick.catId, pickedTask = state.pick.taskId;
    const drift = !!(r && (r.catId !== pickedCat || r.taskId !== pickedTask));

    const catChips = state.categories.map(x => `
      <button class="chip ${r && r.catId === x.id ? 'live' : ''}" data-pickcat="${x.id}" aria-pressed="${pickedCat === x.id}">

    const list = cat(pickedCat) || c;
    const taskChips = (list ? list.tasks : []).map(t => `
      <button class="chip ${r && r.taskId === t.id && r.catId === list.id ? 'live' : ''}" data-picktask="${t.id}" aria-pressed="${pickedTask === t.id}">${esc(t.name)}</button>`).join('')
      + `<button class="chip ghost" data-quickadd="1">+ нова задача</button>`;

    const now = Date.now();
    const dayT = sumBetween(startOfDay(now), now + 1000);
    const weekT = sumBetween(startOfWeek(now), now + 1000);
    const dGoal = state.goals.daily * 3600000, wGoal = state.goals.weekly * 3600000;

    return `
      <div class="card">
        <div class="label">Напрямок</div>
        <div class="chips">${catChips}</div>
        <div class="label">Задача</div>
        <div class="chips">${taskChips}</div>

        <div class="timerbox">
          <div class="readout ${r ? '' : 'idle'}" id="readout">${hms(elapsed())}</div>
          ${r ? `<img class="uni ${running ? 'float' : ''}" src="${AVA}" alt="">` : ''}
        </div>
        <div class="nowline">
          ${r ? `${running ? 'Йде відлік' : 'Пауза'} · ${esc(activeCat ? activeCat.name : '')}${activeTask ? ' · ' + esc(activeTask.name) : ''}`
              : 'Таймер зупинено'}
        </div>

        ${otherRunning ? `<div class="verdict warn" style="margin:0 0 12px">
          Таймер іде ще й на іншому пристрої${(() => {
            const oc = cat(otherRunning.catId), ot = task(otherRunning.catId, otherRunning.taskId);
            const nm = (ot && ot.name) || (oc && oc.name);
            return nm ? ' — ' + esc(nm) + ', з ' + clock(otherRunning.currentStart) : '';
          })()}.
          Зупини його там, інакше цей час порахується двічі.
          <button class="btn small" data-act="dismissother" style="margin-top:8px">Зрозуміло</button>
        </div>` : ''}

        ${drift ? `<div class="verdict good" style="margin:0 0 12px">
          Зараз рахується <b>${esc((activeTask && activeTask.name) || (activeCat && activeCat.name) || '')}</b>.
          Перемкнути — запише цей проміжок і одразу почне новий, без паузи в обліку.
        </div>` : ''}

        <div class="actions">
          ${!r ? `<button class="btn primary" data-act="start">Почати</button>`
               : drift ? `<button class="btn primary" data-act="switch">Перемкнути сюди</button>
                  <button class="btn" data-act="stop">Зупинити і записати</button>`
               : `${running ? `<button class="btn primary" data-act="pause">Пауза</button>`
                            : `<button class="btn primary" data-act="resume">Продовжити</button>`}
                  <button class="btn" data-act="stop">Зупинити і записати</button>
                  <button class="btn danger" data-act="discard">Скинути</button>`}
        </div>
      </div>

      <div class="card">
        <h2>Прогрес</h2>
        <div class="goals">
          <div class="goal">
            <div class="gtop"><b>${hrs(dayT)}</b><span>ціль ${state.goals.daily} год / день</span></div>
            <div class="bar"><i class="${dayT > dGoal ? 'over' : ''}" style="width:${Math.min(100, dGoal ? dayT / dGoal * 100 : 0)}%"></i></div>
          </div>
          <div class="goal">
            <div class="gtop"><b>${hrs(weekT)}</b><span>ціль ${state.goals.weekly} год / тиждень</span></div>
            <div class="bar"><i class="${weekT > wGoal ? 'over' : ''}" style="width:${Math.min(100, wGoal ? weekT / wGoal * 100 : 0)}%"></i></div>
          </div>
        </div>
        <div class="grid2" style="margin-top:14px">
          <div class="field"><label>Годин на день</label><input type="number" min="0" max="24" step="0.5" value="${state.goals.daily}" data-goal="daily"></div>
          <div class="field"><label>Годин на тиждень</label><input type="number" min="0" max="120" step="1" value="${state.goals.weekly}" data-goal="weekly"></div>
        </div>
      </div>`;
  }

  function pol(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  function wedge(cx, cy, r0, r1, a0, a1) {
    const [x0, y0] = pol(cx, cy, r0, a0), [x1, y1] = pol(cx, cy, r1, a0),
          [x2, y2] = pol(cx, cy, r1, a1), [x3, y3] = pol(cx, cy, r0, a1);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r1} ${r1} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${r0} ${r0} 0 0 0 ${x0.toFixed(2)} ${y0.toFixed(2)} Z`;
  }

  function dial(byHour) {
    const size = 320, cx = size / 2, cy = size / 2, r0 = 58, rMax = 130;
    const max = Math.max.apply(null, byHour) || 1;
    let peak = 0; byHour.forEach((v, i) => { if (v > byHour[peak]) peak = i; });

    let paths = '';
    for (let i = 0; i < 24; i++) {
      if (byHour[i] === 0) continue;
      const frac = byHour[i] / max;
      const r1 = r0 + Math.max(3, frac * (rMax - r0));
      paths += `<path d="${wedge(cx, cy, r0, r1, i * 15 + 1.2, (i + 1) * 15 - 1.2)}" fill="url(#gr)" opacity="${(0.4 + 0.6 * frac).toFixed(2)}"></path>`;
    }
    let ticks = '';
    for (let i = 0; i < 24; i++) {
      const major = i % 6 === 0;
      const [tx, ty] = pol(cx, cy, rMax + (major ? 13 : 11), i * 15 + 7.5);
      ticks += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${major ? 10 : 8.5}" fill="${major ? '#7E5AA8' : '#B3A7C2'}">${i}</text>`;
    }
    const total = byHour.reduce((a, b) => a + b, 0);
    return `
      <div class="dialwrap">
        <svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:320px" role="img" aria-label="Активність по годинах доби">
          <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E890B8"></stop><stop offset="100%" stop-color="#9B7FD4"></stop>
          </linearGradient></defs>
          <circle cx="${cx}" cy="${cy}" r="${rMax}" fill="none" stroke="#F4EAF0" stroke-width="1.5"></circle>
          <circle cx="${cx}" cy="${cy}" r="${r0}" fill="none" stroke="#F4EAF0" stroke-width="1.5"></circle>
          ${paths}${ticks}
          <text x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="22" font-weight="400" fill="#7E5AA8">${total ? pad(peak) + ':00' : '—'}</text>
          <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="10" fill="#9C8FAE">пікова година</text>
        </svg>
      </div>`;
  }

  function isWeekend(ms) { const d = new Date(ms).getDay(); return d === 0 || d === 6; }

  function workdaysInRange(sessions) {
    if (!sessions.length) return 1;
    let first = startOfDay(Math.min.apply(null, sessions.map(sessStart)));
    const last = startOfDay(Date.now());
    let c = 0, cur = first, guard = 0;
    while (cur <= last && guard++ < 400) {
      const w = new Date(cur).getDay();
      if (w >= 1 && w <= 5) c++;
      const d = new Date(cur);
      cur = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    }
    return c || 1;
  }

  function daysChart(byDay, n) {
    const today = startOfDay(Date.now());
    const vals = [];
    for (let i = n - 1; i >= 0; i--) {
      const ms = addDays(today, -i);
      vals.push({ ms, v: byDay[dayKey(ms)] || 0, we: isWeekend(ms) });
    }
    const goal = state.goals.daily * 3600000;
    const max = Math.max(goal * 1.1, Math.max.apply(null, vals.map(x => x.v)) * 1.1, 3600000);
    const W = 560, H = 168, base = H - 26, gap = n > 20 ? 3 : 4, bw = (W - gap * (n - 1)) / n;
    let bg = '', bars = '', labels = '';
    vals.forEach((d, i) => {
      const x = i * (bw + gap);
      if (d.we) bg += `<rect x="${(x - gap / 2).toFixed(1)}" y="0" width="${(bw + gap).toFixed(1)}" height="${base + 6}" fill="#F4ECF4"></rect>`;
      const h = Math.max(d.v > 0 ? 3 : 0, d.v / max * base);
      bars += `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${d.v ? (d.we ? '#C6AEDD' : 'url(#gr2)') : '#F0E6EE'}"><title>${humanDate(d.ms)}: ${hrs(d.v)}</title></rect>`;
      labels += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="${n > 20 ? 8.5 : 10}" fill="${d.we ? '#B98FB4' : '#9C8FAE'}">${new Date(d.ms).getDate()}</text>`;
    });
    const gy = base - goal / max * base;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Години по днях">
      <defs><linearGradient id="gr2" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#E890B8"></stop><stop offset="100%" stop-color="#9B7FD4"></stop>
      </linearGradient></defs>
      ${bg}
      <line x1="0" y1="${gy.toFixed(1)}" x2="${W}" y2="${gy.toFixed(1)}" stroke="#E8B84B" stroke-width="1.5" stroke-dasharray="3 4"></line>
      ${bars}${labels}
    </svg>`;
  }

  function gantt(sessions) {
    const byDay = {};
    sessions.forEach(s => {
      const k = dayKey(sessStart(s));
      (byDay[k] = byDay[k] || []).push(s);
    });
    const keys = Object.keys(byDay).sort().slice(-14);
    if (!keys.length) return '';

    let lo = 24 * 60, hi = 0;
    keys.forEach(k => byDay[k].forEach(s => s.segments.forEach(g => {
      const a = new Date(g.s), b = new Date(g.e);
      lo = Math.min(lo, a.getHours() * 60 + a.getMinutes());
      hi = Math.max(hi, b.getHours() * 60 + b.getMinutes() + (b.getDate() !== a.getDate() ? 1440 : 0));
    })));
    lo = Math.max(0, Math.floor(lo / 60) * 60);
    hi = Math.min(1440, Math.ceil(hi / 60) * 60);
    if (hi - lo < 360) hi = Math.min(1440, lo + 360);

    const W = 560, L = 54, R = W - 6, BAR = 13, LANE = 16, GAPD = 20, TOP = 26;
    const xOf = m => L + (Math.min(Math.max(m, lo), hi) - lo) / (hi - lo) * (R - L);

    const blocks = keys.map(k => {
      const items = byDay[k].slice().sort((a, b) => sessStart(a) - sessStart(b));
      const lanes = [];
      items.forEach(s => {
        const a = new Date(sessStart(s)), b = new Date(sessEnd(s));
        const m0 = a.getHours() * 60 + a.getMinutes();
        const m1 = Math.max(m0 + 1, b.getHours() * 60 + b.getMinutes() + (b.getDate() !== a.getDate() ? 1440 : 0));
        const item = { s, m0, m1 };
        let put = false;
        for (const ln of lanes) {
          if (ln.every(o => m0 >= o.m1 || m1 <= o.m0)) { ln.push(item); put = true; break; }
        }
        if (!put) lanes.push([item]);
      });
      return { k, lanes, tot: items.reduce((a, s) => a + s.duration, 0), ms: sessStart(items[0]) };
    });

    const H = TOP + blocks.reduce((a, b) => a + b.lanes.length * LANE + GAPD, 0) + 6;
    let grid = '', rows = '';
    const step = (hi - lo) > 600 ? 120 : 60;
    for (let m = lo; m <= hi; m += step) {
      const x = xOf(m);
      grid += `<line x1="${x.toFixed(1)}" y1="${TOP - 6}" x2="${x.toFixed(1)}" y2="${H - 4}" stroke="#F0E6EE" stroke-width="1"></line>`;
      grid += `<text x="${x.toFixed(1)}" y="${TOP - 12}" text-anchor="middle" font-size="9" fill="#9C8FAE">${pad(m / 60)}</text>`;
    }
    let y = TOP;
    blocks.forEach(b => {
      const d = new Date(b.ms), we = isWeekend(b.ms);
      rows += `<text x="0" y="${(y + 10).toFixed(0)}" font-size="10" fill="${we ? '#B98FB4' : '#4B3A5A'}">${d.getDate()}.${pad(d.getMonth() + 1)} ${DAYS[d.getDay()]}</text>`;
      rows += `<text x="0" y="${(y + 22).toFixed(0)}" font-size="9" fill="#B3A7C2">${hrs(b.tot)}</text>`;
      b.lanes.forEach((ln, i) => ln.forEach(o => {
        const x0 = xOf(o.m0), x1 = xOf(o.m1), c = cat(o.s.catId);
        rows += `<rect x="${x0.toFixed(1)}" y="${(y + i * LANE).toFixed(0)}" width="${Math.max(2, x1 - x0).toFixed(1)}" height="${BAR}" rx="3" fill="${c ? c.color : '#C6AEDD'}"><title>${esc(o.s.taskName || '')} · ${esc(o.s.catName || '')} · ${clock(sessStart(o.s))}–${clock(sessEnd(o.s))}</title></rect>`;
      }));
      y += b.lanes.length * LANE + GAPD;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Хронологія робочих проміжків по днях">${grid}${rows}</svg>`;
  }

  function weekPanel() {
    const w = weekSummary(Date.now());
    const pct = Math.min(100, w.total / w.goal * 100);
    const bars = w.days.map(d => {
      const h = Math.max(d.v > 0 ? 4 : 0, d.v / Math.max(w.perDay * 1.25, 1) * 52);
      const over = d.v > w.perDay;
      return `<div class="wd ${d.today ? 'now' : ''} ${d.we ? 'we' : ''}">
        <div class="wdbar"><i style="height:${Math.min(60, h).toFixed(0)}px;${over ? 'background:linear-gradient(180deg,#E8B84B,#E890B8)' : ''}"></i></div>
        <div class="wdv">${d.v ? hrsShort(d.v) : (d.future ? '' : '—')}</div>
        <div class="wdn">${DAYS[new Date(d.ms).getDay()]}</div>
      </div>`;
    }).join('');

    let verdict, vcls;
    if (w.done) { verdict = 'Норму на тиждень закрито. Понад неї вже ' + hrs(w.total - w.goal) + '.'; vcls = 'good'; }
    else if (w.left === 0) { verdict = 'Тиждень добіг кінця, не вистачило ' + hrs(w.remain) + '.'; vcls = 'warn'; }
    else if (w.ahead >= 0) { verdict = 'Випереджаєш графік на ' + hrs(w.ahead) + '. Лишилось ' + hrs(w.remain) + ' на ' + w.left + (w.left === 1 ? ' день' : ' дні') + ' — по ' + hrs(w.need) + ' на день.'; vcls = 'good'; }
    else { verdict = 'Відстаєш від графіка на ' + hrs(-w.ahead) + '. Лишилось ' + hrs(w.remain) + ' на ' + w.left + (w.left === 1 ? ' день' : ' дні') + ' — по ' + hrs(w.need) + ' на день.'; vcls = 'warn'; }

    const d0 = new Date(w.wStart), d1 = new Date(addDays(w.wStart, 6));

    return `
      <div class="card wk">
        <h2>Цей тиждень · ${d0.getDate()}–${d1.getDate()} ${MONTHS[d1.getMonth()].slice(0, 3)}</h2>
        <div class="wktop">
          <div class="wkbig">${hrs(w.total)}</div>
          <div class="wkof">з ${state.goals.weekly} год</div>
        </div>
        <div class="bar" style="height:10px"><i class="${w.done ? 'over' : ''}" style="width:${pct.toFixed(1)}%"></i></div>

        <div class="wkmetrics">
          <div><b>${w.done ? '—' : hrs(w.remain)}</b><span>лишилось до норми</span></div>
          <div><b>${w.left}</b><span>${w.left === 1 ? 'робочий день попереду' : 'робочих днів попереду'}</span></div>
          <div><b>${w.left && !w.done ? hrs(w.need) : '—'}</b><span>треба на день</span></div>
        </div>

        <div class="wkdays">${bars}</div>
        <div class="verdict ${vcls}">${verdict}</div>
      </div>`;
  }

  function balanceChart() {
    const data = weeklyBalance(12);
    if (data.length < 2) return '';
    const W = 560, H = 190, mid = 90, gap = 7, bw = (W - gap * (data.length - 1)) / data.length;
    const max = Math.max(6 * 3600000, ...data.map(d => Math.abs(d.bal))) * 1.15;
    let bars = '', labels = '', vals = '';
    data.forEach((d, i) => {
      const x = i * (bw + gap);
      const h = Math.abs(d.bal) / max * (mid - 18);
      const up = d.bal >= 0;
      const y = up ? mid - h : mid;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2, h).toFixed(1)}" rx="3"
        fill="${up ? 'url(#gUp)' : '#E8A0B8'}" opacity="${d.cur ? 0.55 : 1}"><title>${hrs(d.v)} при нормі ${hrs(d.norm)}</title></rect>`;
      const dd = new Date(d.ws);
      labels += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 24}" text-anchor="middle" font-size="9" fill="#9C8FAE">${dd.getDate()}.${pad(dd.getMonth() + 1)}</text>`;
      if (Math.abs(d.bal) >= 1800000) {
        vals += `<text x="${(x + bw / 2).toFixed(1)}" y="${(up ? y - 5 : y + h + 11).toFixed(1)}" text-anchor="middle" font-size="9" fill="${up ? '#5B8F7A' : '#B4557E'}">${up ? '+' : '−'}${Math.round(Math.abs(d.bal) / 3600000 * 10) / 10}</text>`;
      }
    });
    const sum = data.reduce((a, d) => a + d.bal, 0);
    return `
      <div class="card">
        <h2>Баланс по тижнях</h2>
        <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Баланс годин по тижнях">
          <defs><linearGradient id="gUp" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#A8D5C2"></stop><stop offset="100%" stop-color="#7FBEA8"></stop>
          </linearGradient></defs>
          <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="#D8CCE4" stroke-width="1"></line>
          ${bars}${vals}${labels}
          <text x="0" y="${H - 6}" font-size="9" fill="#9C8FAE">Вгору — відпрацьовано понад норму, вниз — недобір. Цифри в годинах.</text>
        </svg>
        <div class="verdict ${sum >= 0 ? 'good' : 'warn'}" style="margin-top:10px">
          Накопичено за ${data.length} тижнів: ${sum >= 0 ? 'плюс ' + hrs(sum) : 'мінус ' + hrs(-sum)}.
          Поточний тиждень показано блідим — він ще не завершився.
        </div>
      </div>`;
  }

  function periodBar() {
    const items = [['tw', 'Цей тиждень'], ['lw', 'Минулий'], [30, '30 днів'], [90, '90 днів'], [0, 'Весь час']];
    const r = periodRange();
    const today = dateStr(Date.now());
    return `
      <div class="seg">${items.map(([v, n]) => `<button data-period="${v}" aria-selected="${period === v}">${n}</button>`).join('')}
        <button data-period="custom" aria-selected="${period === 'custom'}" title="Свій інтервал">Свій</button>
      </div>
      ${period === 'custom' ? `
      <div class="card" style="padding:12px 14px;margin-bottom:12px">
        <div class="grid2">
          <div class="field" style="margin:0"><label>Від</label><input type="date" id="cf" value="${custom.from || today}" max="${today}"></div>
          <div class="field" style="margin:0"><label>До</label><input type="date" id="ct" value="${custom.to || today}" max="${today}"></div>
        </div>
      </div>` : ''}
      ${period !== 'tw' && period !== 'custom' ? '' : ''}`;
  }

  function viewStats() {
    const list = inPeriod();
    const s = stats(list);
    const cats = state.categories
      .map(c => ({ c, v: s.byCat[c.id] || 0 }))
      .filter(x => x.v > 0)
      .sort((a, b) => b.v - a.v);
    const maxCat = cats.length ? cats[0].v : 1;

    if (!list.length) {
      return weekPanel() + periodBar() + `<div class="card"><h2>Аналітика</h2>
        <div class="empty"><img src="${DECOR}" alt="">За цей період ще немає записів.<br>Вибери інший інтервал або запусти таймер.</div></div>`;
    }

    const r = periodRange();
    const workdays = Math.max(1, workdaysBetween(r.from, Math.min(r.to, Date.now())));
    const weekendMs = list.reduce((a, s) => a + (isWeekend(sessStart(s)) ? s.duration : 0), 0);
    const spanDays = Math.min(60, Math.max(1, Math.round((Math.min(r.to, Date.now()) - r.from) / 86400000) + 1));
    const norm = workdays * (state.goals.daily || 8) * 3600000;

    return weekPanel() + balanceChart() + periodBar() + `
      <div class="card">
        <h2>Коли ти працюєш</h2>
        ${dial(s.byHour)}
        <div class="hint">Кожен промінь — година доби. Що довший, то більше часу ти в ній працювала.</div>
      </div>

      <div class="card">
        <h2>Розподіл по напрямках</h2>
        ${cats.map(x => `
          <div class="catrow">
            <span class="nm">${esc(x.c.name)}</span>
            <span class="track"><i style="width:${(x.v / maxCat * 100).toFixed(1)}%;background:${x.c.color}"></i></span>
            <span class="val">${hrs(x.v)} · ${Math.round(x.v / s.total * 100)}%</span>
          </div>`).join('')}
      </div>

      <div class="card">
        <h2>Хронологія днів</h2>
        ${gantt(list)}
        <div class="chips" style="margin:10px 0 0">
          ${cats.map(x => `<span class="chip" style="font-size:12px;padding:3px 9px"><span class="dot" style="background:${x.c.color}"></span>${esc(x.c.name)}</span>`).join('')}
        </div>
        <div class="hint">Смуга — один проміжок роботи. Коли проміжки накладаються, вони розходяться на два рядки.</div>
      </div>

      <div class="card">
        <h2>По днях · ${r.label}</h2>
        ${daysChart(s.byDay, spanDays)}
        <div class="wkmetrics" style="margin-top:14px">
          <div><b>${hrs(s.total)}</b><span>всього за період</span></div>
          <div><b>${hrs(s.total / workdays)}</b><span>у середньому за робочий день</span></div>
          <div><b style="color:${s.total - norm >= 0 ? '#4FA88B' : '#B4557E'}">${s.total - norm >= 0 ? '+' : ''}${hrs(s.total - norm)}</b><span>проти норми ${hrs(norm)}</span></div>
        </div>
        <div class="hint">Норма рахується як ${workdays} ${workdays === 1 ? 'робочий день' : 'робочих днів'} пн–пт × ${state.goals.daily} год. Години вихідних${weekendMs ? ' (' + hrs(weekendMs) + ')' : ''} входять у суму, але вихідні не збільшують норму. Рожеві стовпчики й світлий фон — субота й неділя.</div>
      </div>`;
  }

  function dateStr(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function findCheckin(ds) { return (state.checkins || []).find(c => c.date === ds) || null; }
  function dsToMs(ds) { const p = ds.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getTime(); }

  function ciInit() {
    if (!ciDate) ciDate = dateStr(Date.now());
    if (!ciDraft || ciDraft.date !== ciDate) {
      const ex = findCheckin(ciDate);
      ciDraft = ex ? JSON.parse(JSON.stringify(ex)) : { date: ciDate, level: null, spheres: {}, note: '' };
      ciDraft.spheres = ciDraft.spheres || {};
    }
  }

  function levelColor(v) {
    const stops = ['#D98FA8', '#E0A08F', '#E8BE7E', '#CFC97E', '#A8CF9B', '#7FC9A8'];
    return stops[Math.max(0, Math.min(5, Math.round(v / 2)))];
  }

  function radar(avg, list) {
    const size = 300, cx = 150, cy = 148, R = 96, n = list.length;
    if (!n) return '';
    const pt = (i, r) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    };
    let rings = '';
    for (let k = 1; k <= 5; k++) {
      const pts = [];
      for (let i = 0; i < n; i++) { const p = pt(i, R * k / 5); pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
      rings += `<polygon points="${pts.join(' ')}" fill="none" stroke="#F0E6EE" stroke-width="1"></polygon>`;
    }
    let axes = '', labels = '', dots = '';
    const poly = [];
    list.forEach((sp, i) => {
      const e = pt(i, R);
      axes += `<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="#F0E6EE" stroke-width="1"></line>`;
      const v = avg[sp.id] || 0;
      const p = pt(i, R * Math.min(5, v) / 5);
      poly.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
      if (v > 0) dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${sp.color}"><title>${esc(sp.name)}: ${v.toFixed(1)} з 5</title></circle>`;
      const l = pt(i, R + 22);
      const anchor = Math.abs(l[0] - cx) < 12 ? 'middle' : (l[0] > cx ? 'start' : 'end');
      labels += `<text x="${l[0].toFixed(1)}" y="${l[1].toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="9.5" fill="#6B6075">${esc(sp.name)}</text>`;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:340px" role="img" aria-label="Колесо балансу">
      ${rings}${axes}
      <polygon points="${poly.join(' ')}" fill="#B49AE4" fill-opacity="0.22" stroke="#9B7FD4" stroke-width="1.5"></polygon>
      ${dots}${labels}
    </svg>`;
  }

  function levelChart(list, n) {
    const today = startOfDay(Date.now());
    const W = 560, H = 150, base = H - 24, gap = n > 20 ? 3 : 4, bw = (W - gap * (n - 1)) / n;
    let bg = '', bars = '', labels = '';
    for (let i = 0; i < n; i++) {
      const ms = addDays(today, -(n - 1 - i));
      const ds = dateStr(ms);
      const c = list.find(x => x.date === ds);
      const x = i * (bw + gap);
      if (isWeekend(ms)) bg += `<rect x="${(x - gap / 2).toFixed(1)}" y="0" width="${(bw + gap).toFixed(1)}" height="${base + 6}" fill="#F4ECF4"></rect>`;
      if (c && typeof c.level === 'number') {
        const h = Math.max(3, c.level / 10 * base);
        bars += `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${levelColor(c.level)}"><title>${humanDate(ms)}: ${c.level} з 10</title></rect>`;
      } else {
        bars += `<rect x="${x.toFixed(1)}" y="${(base - 3).toFixed(1)}" width="${bw.toFixed(1)}" height="3" rx="1.5" fill="#F0E6EE"></rect>`;
      }
      labels += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="${n > 20 ? 8.5 : 10}" fill="${isWeekend(ms) ? '#B98FB4' : '#9C8FAE'}">${new Date(ms).getDate()}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Рівень ресурсу по днях">${bg}${bars}${labels}</svg>`;
  }

  function crossChart(list, n) {
    const today = startOfDay(Date.now());
    const hoursBy = {};
    state.sessions.forEach(s => s.segments.forEach(g => eachHourChunk(g.s, g.e, (st, ms) => {
      hoursBy[dayKey(st)] = (hoursBy[dayKey(st)] || 0) + ms;
    })));
    const days = [];
    for (let i = 0; i < n; i++) {
      const ms = addDays(today, -(n - 1 - i)), ds = dateStr(ms);
      const c = list.find(x => x.date === ds);
      days.push({ ms, ds, h: (hoursBy[ds] || 0) / 3600000, lv: c && typeof c.level === 'number' ? c.level : null });
    }
    if (!days.some(d => d.lv !== null)) return '';
    const maxH = Math.max(8, ...days.map(d => d.h));
    const W = 560, H = 160, base = H - 24, gap = 4, bw = (W - gap * (n - 1)) / n;
    let bars = '', dots = '', path = [];
    days.forEach((d, i) => {
      const x = i * (bw + gap);
      const h = d.h / maxH * base;
      if (h > 0) bars += `<rect x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#DCCFEC"><title>${humanDate(d.ms)}: ${d.h.toFixed(1)} год роботи</title></rect>`;
      if (d.lv !== null) {
        const y = base - d.lv / 10 * base;
        const cxx = x + bw / 2;
        path.push((path.length ? 'L' : 'M') + cxx.toFixed(1) + ' ' + y.toFixed(1));
        dots += `<circle cx="${cxx.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${levelColor(d.lv)}" stroke="#FFFCF7" stroke-width="1.5"><title>${humanDate(d.ms)}: ресурс ${d.lv} з 10</title></circle>`;
      }
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Години роботи та рівень ресурсу">
      ${bars}<path d="${path.join(' ')}" fill="none" stroke="#C9A8DC" stroke-width="1.5"></path>${dots}
      <text x="0" y="${H - 6}" font-size="9" fill="#9C8FAE">Стовпчики — години роботи, точки — ресурс на кінець дня</text>
    </svg>`;
  }

  function viewResource() {
    ciInit();
    const todayDs = dateStr(Date.now()), yDs = dateStr(addDays(Date.now(), -1));
    const saved = findCheckin(ciDate);
    const sph = state.spheres || [];

    const lvls = [];
    for (let i = 0; i <= 10; i++) {
      lvls.push(`<button class="lvl" data-level="${i}" aria-pressed="${ciDraft.level === i}" style="${ciDraft.level === i ? 'background:' + levelColor(i) + ';border-color:' + levelColor(i) + ';color:#fff' : ''}">${i}</button>`);
    }

    const rows = sph.map(s => {
      const cur = ciDraft.spheres[s.id] || { v: 0, fill: false };
      const btns = [0, 1, 2, 3, 4, 5].map(v =>
        `<button class="lvl sm" data-sph="${s.id}" data-v="${v}" aria-pressed="${cur.v === v}" style="${cur.v === v ? 'background:' + s.color + ';border-color:' + s.color + ';color:#fff' : ''}">${v}</button>`).join('');
      return `<div class="sphrow">
        <div class="sphname"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}
          <button class="x" data-delsph="${s.id}" aria-label="Прибрати сферу">×</button>
        </div>
        <div class="sphbtns">${btns}
          <button class="chip ghost ${cur.fill ? 'on' : ''}" data-fill="${s.id}" aria-pressed="${!!cur.fill}" style="margin-left:6px;font-size:11.5px;padding:3px 9px">${cur.fill ? '↑ наповнило' : '↑'}</button>
        </div>
      </div>`;
    }).join('');

    const rr = periodRange();
    const list = (state.checkins || []).filter(c => {
      const t = dsToMs(c.date);
      return t >= startOfDay(rr.from) && t <= rr.to;
    });
    const spanR = Math.min(60, Math.max(1, Math.round((Math.min(rr.to, Date.now()) - rr.from) / 86400000) + 1));

    const avg = {};
    sph.forEach(s => {
      const vals = list.map(c => (c.spheres && c.spheres[s.id] && !c.spheres[s.id].fill) ? c.spheres[s.id].v || 0 : 0);
      avg[s.id] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    });
    const fills = sph.map(s => ({
      s, n: list.filter(c => c.spheres && c.spheres[s.id] && c.spheres[s.id].fill).length
    })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);

    const withLv = list.filter(c => typeof c.level === 'number');
    const avgLv = withLv.length ? withLv.reduce((a, c) => a + c.level, 0) / withLv.length : null;

    const analytics = !list.length ? `
      <div class="card"><h2>Аналітика стану</h2>
        <div class="empty"><img src="${DECOR}" alt="">Тут зʼявиться колесо балансу й динаміка.<br>Потрібен хоча б один чек-ін.</div>
      </div>` : `
      ${periodBar()}

      <div class="card">
        <h2>Колесо балансу</h2>
        <div class="dialwrap">${radar(avg, sph)}</div>
        <div class="hint">Що далі точка від центру, то більше сил ця сфера забирала в середньому за період. Шкала 0–5.${fills.length ? ' Наповнювали: ' + fills.map(f => esc(f.s.name) + ' (' + f.n + ')').join(', ') + '.' : ''}</div>
      </div>

      <div class="card">
        <h2>Рівень ресурсу по днях</h2>
        ${levelChart(list, spanR)}
        <div class="goals" style="margin-top:12px">
          <div class="goal"><div class="gtop"><b>${avgLv !== null ? avgLv.toFixed(1) : '—'}</b><span>середній рівень за період</span></div></div>
          <div class="goal"><div class="gtop"><b>${withLv.length}</b><span>чек-інів записано</span></div></div>
        </div>
        <div class="hint">Світлий фон — вихідні. Порожній день означає, що чек-іну не було.</div>
      </div>

      ${crossChart(list, spanR) ? `<div class="card">
        <h2>Робота і ресурс поруч</h2>
        ${crossChart(list, spanR)}
        <div class="hint">Тут видно, що стається з ресурсом після довгих днів і чи відновлюється він на вихідних.</div>
      </div>` : ''}`;

    return `
      <div class="card">
        <h2>Чек-ін ${saved ? '· запис уже є, можна змінити' : ''}</h2>
        <div class="chips">
          <button class="chip" data-cidate="${todayDs}" aria-pressed="${ciDate === todayDs}">Сьогодні</button>
          <button class="chip" data-cidate="${yDs}" aria-pressed="${ciDate === yDs}">Вчора</button>
          <input type="date" id="ci-date" value="${ciDate}" style="width:auto;padding:5px 9px;font-size:13px">
        </div>

        <div class="label" style="margin-top:14px">Скільки ресурсу лишилось на кінець дня</div>
        <div class="lvlrow">${lvls.join('')}</div>
        <div class="hint" style="margin:6px 0 0">0 — сил не лишилось зовсім, 10 — повна батарея.</div>

        <div class="label" style="margin-top:18px">Куди пішли сили</div>
        ${rows || '<div class="empty">Сфер поки немає</div>'}
        <div class="inline" style="margin-top:8px">
          <input type="text" placeholder="Додати сферу" id="newsph">
          <button class="btn small" data-act="addsph">Додати</button>
        </div>
        <div class="hint">0 — ця сфера сьогодні нічого не забрала, 5 — забрала майже все. Стрілка ↑ означає навпаки: сфера не висушила, а наповнила.</div>

        <div class="field" style="margin-top:16px">
          <label>Що наповнило, що висушило</label>
          <textarea id="ci-note" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:14px;color:var(--ink);resize:vertical">${esc(ciDraft.note || '')}</textarea>
        </div>

        <div class="actions">
          <button class="btn primary" data-act="savecheckin">${saved ? 'Оновити запис' : 'Записати день'}</button>
          ${saved ? `<button class="btn danger" data-act="delcheckin">Видалити</button>` : ''}
        </div>
      </div>

      ${analytics}`;
  }

  function viewTasks() {
    return `
      <div class="card">
        <h2>Напрямки і задачі</h2>
        ${state.categories.map(c => `
          <div class="catblock">
            <div class="chead"><span style="width:10px;height:10px;border-radius:50%;background:${c.color};display:inline-block"></span>${esc(c.name)}
              <button class="btn small danger" style="margin-left:auto" data-delcat="${c.id}">Видалити</button>
            </div>
            <div class="chips">
              ${c.tasks.map(t => `<span class="chip">${esc(t.name)} <button class="x" data-deltask="${c.id}|${t.id}" aria-label="Видалити задачу">×</button></span>`).join('') || '<span class="empty">Задач поки немає</span>'}
            </div>
            <div class="inline">
              <input type="text" placeholder="Нова задача" data-newtask="${c.id}">
              <button class="btn small" data-addtask="${c.id}">Додати</button>
            </div>
          </div>`).join('')}
        <div style="padding-top:14px">
          <div class="label">Новий напрямок</div>
          <div class="inline">
            <input type="text" placeholder="Наприклад: Партнерства" id="newcat">
            <button class="btn small" data-addcat="1">Додати</button>
          </div>
        </div>
        <div class="hint">Видалення напрямку не стирає вже записані години — вони залишаються в історії.</div>
      </div>`;
  }

  function viewHistory() {
    const groups = {};
    state.sessions.slice().sort((a, b) => sessStart(b) - sessStart(a)).forEach(s => {
      const k = dayKey(sessStart(s));
      (groups[k] = groups[k] || []).push(s);
    });
    const keys = Object.keys(groups);
    const now = new Date();
    const todayVal = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

    const form = `
      <div class="card">
        <h2>Додати запис вручну</h2>
        <div class="grid2">
          <div class="field"><label>Дата</label><input type="date" id="m-date" value="${todayVal}"></div>
          <div class="field"><label>Напрямок</label>
            <select id="m-cat">${state.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Початок</label><input type="time" id="m-from" value="09:00"></div>
          <div class="field"><label>Кінець</label><input type="time" id="m-to" value="10:00"></div>
        </div>
        <div class="field"><label>Задача</label><select id="m-task">${(state.categories[0] ? state.categories[0].tasks : []).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
        <button class="btn small" data-act="manual">Додати запис</button>
      </div>`;

    if (!keys.length) {
      return form + `<div class="card"><h2>Історія</h2><div class="empty"><img src="${DECOR}" alt="">Тут зʼявляться всі твої проміжки роботи.<br>Поки що жодного немає.</div></div>`;
    }

    return form + `
      <div class="card">
        <h2>Історія</h2>
        ${keys.map(k => {
          const items = groups[k];
          const tot = items.reduce((a, s) => a + s.duration, 0);
          return `<div class="daygroup">
            <div class="dhead"><span>${humanDate(sessStart(items[0]))}</span><span>${hrs(tot)}</span></div>
            ${items.map(s => {
              const c = cat(s.catId);
              return `<div class="row">
                <span class="dot" style="background:${c ? c.color : '#D8CCE4'}"></span>
                <span class="txt">
                  <div class="t1">${esc(s.taskName || '—')}</div>
                  <div class="t2">${esc(s.catName || (c ? c.name : ''))} · ${clock(sessStart(s))}–${clock(sessEnd(s))}</div>
                </span>
                <span class="dur">${hrs(s.duration)}</span>
                <button class="x" data-delsess="${s.id}" aria-label="Видалити запис">×</button>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
        <div class="inline" style="margin-top:6px">
          <button class="btn small" data-act="export">Експорт CSV</button>
          <button class="btn small danger" data-act="clearall">Очистити історію</button>
        </div>
      </div>`;
  }

  function startTick() {
    if (ticker) clearInterval(ticker);
    if (state.running && state.running.currentStart && tab === 'timer') {
      ticker = setInterval(() => {
        const el = document.getElementById('readout');
        if (el) el.textContent = hms(elapsed()); else clearInterval(ticker);
      }, 1000);
    }
  }

  function startTimer() {
    state.running = { catId: state.pick.catId, taskId: state.pick.taskId, segments: [], currentStart: Date.now() };
    render(); save();
  }

  /* quiet — перемикання: запис без окремого повідомлення й без зайвого рендеру */
  function stopAndSave(quiet) {
    const r = state.running;
    if (!r) return;
    const segs = r.segments.concat(r.currentStart ? [{ s: r.currentStart, e: Date.now() }] : []);
    const dur = segs.reduce((a, g) => a + (g.e - g.s), 0);
    state.running = null;
    if (dur < 20000) {
      if (!quiet) { toast('Проміжок коротший за 20 секунд — не записую'); render(); save(); }
      return;
    }
    const c = cat(r.catId), t = task(r.catId, r.taskId);
    state.sessions.push({
      id: uid(), catId: r.catId, taskId: r.taskId,
      catName: c ? c.name : '', taskName: t ? t.name : '',
      segments: segs, duration: dur
    });
    if (quiet) return;
    toast('Записано ' + hrs(dur));
    render(); save();
  }

  function grabNote() {
    const el = document.getElementById('ci-note');
    if (el && ciDraft) ciDraft.note = el.value;
  }

  function bind() {
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
    app.querySelectorAll('[data-period]').forEach(b => b.onclick = () => {
      grabNote();
      const v = b.dataset.period;
      period = (v === 'tw' || v === 'lw' || v === 'custom') ? v : +v;
      if (period === 'custom' && !custom.from) {
        custom.to = dateStr(Date.now());
        custom.from = dateStr(addDays(Date.now(), -6));
      }
      render();
    });
    const cf = document.getElementById('cf'), ct = document.getElementById('ct');
    if (cf) cf.onchange = () => { custom.from = cf.value; render(); };
    if (ct) ct.onchange = () => { custom.to = ct.value; render(); };

    app.querySelectorAll('[data-level]').forEach(b => b.onclick = () => {
      grabNote();
      const v = +b.dataset.level;
      ciDraft.level = ciDraft.level === v ? null : v;
      render();
    });
    app.querySelectorAll('[data-sph]').forEach(b => b.onclick = () => {
      grabNote();
      const id = b.dataset.sph, v = +b.dataset.v;
      const cur = ciDraft.spheres[id] || { v: 0, fill: false };
      cur.v = cur.v === v ? 0 : v;
      ciDraft.spheres[id] = cur;
      render();
    });
    app.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => {
      grabNote();
      const id = b.dataset.fill;
      const cur = ciDraft.spheres[id] || { v: 0, fill: false };
      cur.fill = !cur.fill;
      ciDraft.spheres[id] = cur;
      render();
    });
    app.querySelectorAll('[data-cidate]').forEach(b => b.onclick = () => {
      grabNote(); ciDate = b.dataset.cidate; ciDraft = null; render();
    });
    const cid = document.getElementById('ci-date');
    if (cid) cid.onchange = () => { grabNote(); if (cid.value) { ciDate = cid.value; ciDraft = null; render(); } };
    app.querySelectorAll('[data-delsph]').forEach(b => b.onclick = () => {
      grabNote();
      const s = (state.spheres || []).find(x => x.id === b.dataset.delsph);
      if (!s || !confirm('Прибрати сферу «' + s.name + '»? Записані чек-іни не зміняться.')) return;
      state.spheres = state.spheres.filter(x => x.id !== s.id);
      render(); save();
    });

    app.querySelectorAll('[data-pickcat]').forEach(b => b.onclick = () => {
      const c = cat(b.dataset.pickcat);
      state.pick = { catId: c.id, taskId: c.tasks[0] ? c.tasks[0].id : null };
      render(); save();
    });
    app.querySelectorAll('[data-picktask]').forEach(b => b.onclick = () => {
      state.pick.taskId = b.dataset.picktask; render(); save();
    });
    const qa = app.querySelector('[data-quickadd]');
    if (qa) qa.onclick = () => {
      const name = prompt('Назва нової задачі');
      if (!name || !name.trim()) return;
      const c = cat(state.pick.catId); if (!c) return;
      const t = { id: uid(), name: name.trim() };
      c.tasks.push(t); state.pick.taskId = t.id; render(); save();
    };

    app.querySelectorAll('[data-goal]').forEach(i => i.onchange = () => {
      const v = parseFloat(i.value); if (isNaN(v) || v < 0) return;
      state.goals[i.dataset.goal] = v; render(); save();
    });

    app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'start') {
        if (!state.pick.taskId) { toast('Спочатку обери задачу'); return; }
        startTimer();
      }
      if (a === 'dismissother') { otherRunning = null; render(); return; }
      if (a === 'switch') {
        if (!state.pick.taskId) { toast('Спочатку обери задачу'); return; }
        const r = state.running;
        if (!r) { startTimer(); return; }
        const same = r.catId === state.pick.catId && r.taskId === state.pick.taskId;
        if (same) { toast('Це та сама задача'); return; }
        stopAndSave(true);
        startTimer();
        const c = cat(state.pick.catId), tk = task(state.pick.catId, state.pick.taskId);
        toast('Перемкнуто на ' + ((tk && tk.name) || (c && c.name) || 'нову задачу'));
      }
      if (a === 'pause') {
        const r = state.running;
        if (r && r.currentStart) { r.segments.push({ s: r.currentStart, e: Date.now() }); r.currentStart = null; }
        render(); save();
      }
      if (a === 'resume') { state.running.currentStart = Date.now(); render(); save(); }
      if (a === 'stop') stopAndSave();
      if (a === 'discard') {
        if (confirm('Скинути поточний відлік без запису?')) { state.running = null; render(); save(); }
      }
      if (a === 'addsph') {
        grabNote();
        const el = document.getElementById('newsph');
        const v = el ? el.value.trim() : '';
        if (!v) return;
        state.spheres = (state.spheres || []).concat([{ id: uid(), name: v, color: PALETTE[(state.spheres || []).length % PALETTE.length] }]);
        render(); save();
      }
      if (a === 'savecheckin') {
        grabNote();
        if (ciDraft.level === null && !Object.keys(ciDraft.spheres).some(k => ciDraft.spheres[k].v) && !ciDraft.note) {
          toast('Порожній чек-ін — познач хоча б рівень');
          return;
        }
        const rec = JSON.parse(JSON.stringify(ciDraft));
        rec.at = Date.now();
        (state.spheres || []).forEach(s => { if (rec.spheres[s.id]) rec.spheres[s.id].name = s.name; });
        state.checkins = (state.checkins || []).filter(c => c.date !== rec.date).concat([rec]).sort((a, b) => a.date < b.date ? -1 : 1);
        ciDraft = null;
        toast(ciDate === dateStr(Date.now()) ? 'День записано' : 'Записано за ' + ciDate);
        render(); save();
      }
      if (a === 'delcheckin') {
        if (!confirm('Видалити чек-ін за ' + ciDate + '?')) return;
        state.checkins = (state.checkins || []).filter(c => c.date !== ciDate);
        ciDraft = null;
        render(); save();
      }
      if (a === 'manual') addManual();
      if (a === 'export') exportCsv();
      if (a === 'clearall') {
        if (confirm('Видалити всі записи назавжди? Це зітре їх і в Google Таблиці.')) {
          state.deleted = (state.deleted || []).concat(state.sessions.map(s => s.id)).slice(-500);
          state.sessions = []; render(); save(); toast('Історію очищено');
        }
      }
      if (a === 'syncnow') {
        (async () => {
          const okLoad = await cloudLoad();
          render();
          const okSave = await cloudSave();
          toast(okLoad && okSave ? 'Синхронізовано з таблицею' : 'Таблиця недоступна: ' + sync.err);
        })();
      }
      if (a === 'diag') {
        (async () => {
          let ping = 'перевіряю…';
          try { await api({ action: 'ping' }, 20000); ping = 'OK — таблиця відповіла'; }
          catch (err) { ping = 'ПОМИЛКА — ' + (err.message || err); }
          const info = [
            'Тест звʼязку: ' + ping,
            'Остання помилка: ' + (sync.err || 'немає'),
            'Сховище на пристрої: ' + (window.storage && window.storage.get ? 'Claude' : lsOk ? 'localStorage' : 'НЕДОСТУПНЕ (лише памʼять)'),
            'Ключ: ' + (SYNC.token ? 'збережено на цьому пристрої' : 'немає'),
            'Режим додатка: ' + (document.documentElement.getAttribute('data-standalone') ? 'так (з головного екрана)' : 'ні (вкладка браузера)'),
            'Адреса сторінки: ' + (location && location.origin ? location.origin : 'невідома'),
            'Протокол: ' + (location ? location.protocol : '?'),
            'Записів у памʼяті: ' + state.sessions.length,
            'Онлайн: ' + (navigator.onLine ? 'так' : 'ні'),
            'URL скрипта: ' + SYNC.url
          ].join('\n');
          modal = `<div class="modal"><div class="box">
            <h2 style="margin-top:0;font-size:14px">Діагностика синхронізації</h2>
            <textarea id="csvbox" readonly>${esc(info)}</textarea>
            <div class="inline" style="margin-top:10px">
              <button class="btn small" data-act="copycsv">Скопіювати</button>
              <button class="btn small" data-act="closemodal">Закрити</button>
              <button class="btn small danger" data-act="forgettoken">Забути ключ</button>
            </div>
            <div class="hint">Надішли цей текст у чат — по ньому видно, де саме рветься ланцюг.</div>
          </div></div>`;
          render();
        })();
      }
      if (a === 'forgettoken') {
        if (!confirm('Забути ключ на цьому пристрої? Записи в таблиці лишаться, але трекер попросить ключ знову.')) return;
        saveToken(''); modal = null; renderToken();
        return;
      }
      if (a === 'closemodal') { modal = null; render(); }
      if (a === 'copycsv') {
        const ta = document.getElementById('csvbox');
        ta.select(); ta.setSelectionRange(0, 999999);
        try { document.execCommand('copy'); toast('Скопійовано'); } catch (e) { toast('Виділи текст і скопіюй вручну'); }
      }
    });

    app.querySelectorAll('[data-addtask]').forEach(b => b.onclick = () => {
      const id = b.dataset.addtask;
      const inp = app.querySelector(`[data-newtask="${id}"]`);
      const v = inp.value.trim(); if (!v) return;
      cat(id).tasks.push({ id: uid(), name: v }); render(); save();
    });
    app.querySelectorAll('[data-deltask]').forEach(b => b.onclick = () => {
      const parts = b.dataset.deltask.split('|');
      const c = cat(parts[0]); c.tasks = c.tasks.filter(t => t.id !== parts[1]);
      if (state.pick.taskId === parts[1]) state.pick.taskId = c.tasks[0] ? c.tasks[0].id : null;
      render(); save();
    });
    const ac = app.querySelector('[data-addcat]');
    if (ac) ac.onclick = () => {
      const v = document.getElementById('newcat').value.trim(); if (!v) return;
      state.categories.push({ id: uid(), name: v, color: PALETTE[state.categories.length % PALETTE.length], tasks: [] });
      render(); save();
    };
    app.querySelectorAll('[data-delcat]').forEach(b => b.onclick = () => {
      const c = cat(b.dataset.delcat);
      if (!confirm('Видалити напрямок «' + c.name + '»? Записані години залишаться в історії.')) return;
      state.categories = state.categories.filter(x => x.id !== c.id);
      if (state.pick.catId === c.id) {
        const f = state.categories[0];
        state.pick = { catId: f ? f.id : null, taskId: f && f.tasks[0] ? f.tasks[0].id : null };
      }
      render(); save();
    });
    app.querySelectorAll('[data-delsess]').forEach(b => b.onclick = () => {
      state.deleted = (state.deleted || []).concat([b.dataset.delsess]).slice(-500);
      state.sessions = state.sessions.filter(s => s.id !== b.dataset.delsess);
      render(); save();
    });

    const mc = document.getElementById('m-cat');
    if (mc) mc.onchange = () => {
      const c = cat(mc.value);
      document.getElementById('m-task').innerHTML = c.tasks.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
    };
  }

  function addManual() {
    const d = document.getElementById('m-date').value;
    const f = document.getElementById('m-from').value;
    const t2 = document.getElementById('m-to').value;
    const cid = document.getElementById('m-cat').value;
    const tid = document.getElementById('m-task').value;
    if (!d || !f || !t2) { toast('Заповни дату і час'); return; }
    const s = new Date(d + 'T' + f).getTime();
    let e = new Date(d + 'T' + t2).getTime();
    if (e <= s) e += 86400000;
    const c = cat(cid), tk = task(cid, tid);
    state.sessions.push({
      id: uid(), catId: cid, taskId: tid,
      catName: c ? c.name : '', taskName: tk ? tk.name : '',
      segments: [{ s, e }], duration: e - s
    });
    toast('Запис додано');
    render(); save();
  }

  function exportCsv() {
    const rows = [['Дата', 'Початок', 'Кінець', 'Напрямок', 'Задача', 'Хвилини', 'Години']];
    state.sessions.slice().sort((a, b) => sessStart(a) - sessStart(b)).forEach(s => {
      rows.push([
        dayKey(sessStart(s)), clock(sessStart(s)), clock(sessEnd(s)),
        s.catName || '', s.taskName || '',
        Math.round(s.duration / 60000), (s.duration / 3600000).toFixed(2)
      ]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    modal = `<div class="modal"><div class="box">
      <h2 style="margin-top:0;font-size:14px">CSV для аналізу</h2>
      <textarea id="csvbox" readonly>${esc(csv)}</textarea>
      <div class="inline" style="margin-top:10px">
        <button class="btn small" data-act="copycsv">Скопіювати</button>
        <button class="btn small" data-act="closemodal">Закрити</button>
      </div>
      <div class="hint">Надішли цей текст у чат — і я зроблю глибокий розбір за будь-який період.</div>
    </div></div>`;
    render();
  }

  (async function init() {
    try {
      const r = await store.get(KEY);
      state = r && r.value ? JSON.parse(r.value) : DEFAULT();
    } catch (e) {
      state = DEFAULT();
    }
    if (!state || !state.categories) state = DEFAULT();
    state.sessions = state.sessions || [];
    state.goals = state.goals || { daily: 6, weekly: 30 };
    state.pick = state.pick || { catId: state.categories[0].id, taskId: state.categories[0].tasks[0].id };
    state.deleted = state.deleted || [];
    state.checkins = state.checkins || [];
    if (!Array.isArray(state.spheres) || !state.spheres.length) state.spheres = DEFAULT().spheres;
    if ((state.version || 1) < 2) {
      state.categories.forEach(c => { if (RECOLOR[c.color]) c.color = RECOLOR[c.color]; });
      state.version = 2;
    }
    render();

    if (SYNC.token) {
      const ok = await cloudLoad();
      render();
      if (ok) {
        await cloudSave();
        try { await store.set(KEY, JSON.stringify(state)); } catch (e) {}
      }
    }

    setInterval(() => { if (SYNC.token && sync.dirty) cloudSave(); }, 45000);
    window.addEventListener('online', () => { if (SYNC.token && sync.dirty) cloudSave(); });

    /* повернулися до трекера після іншого пристрою — підтягуємо свіже */
    let refreshing = false;
    async function refreshOnReturn() {
      if (!SYNC.token || refreshing) return;
      if (document.visibilityState === 'hidden') return;
      if (Date.now() - (sync.readAt || 0) < 20000) return;
      refreshing = true;
      try {
        if (sync.dirty) { await cloudSave(); }
        else if (await cloudLoad()) { render(); }
      } finally { refreshing = false; }
    }
    document.addEventListener('visibilitychange', refreshOnReturn);
    window.addEventListener('focus', refreshOnReturn);
    window.addEventListener('pageshow', refreshOnReturn);
  })();
})();
</script>

</body>
</html>
